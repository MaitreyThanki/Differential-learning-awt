
<!DOCTYPE html>
<html lang="en" ng-app="studentApp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>

    <!-- AngularJS Library -->
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <script src="app.js"></script>
    <script src="controller.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f8;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 750px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 10px #cccccc;
        }

        h2, h3 {
            text-align: center;
            color: #263b60;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 9px;
            margin-top: 5px;
            border: 1px solid #bbb;
            border-radius: 5px;
        }

        button {
            margin-top: 15px;
            padding: 10px 16px;
            border: none;
            border-radius: 5px;
            background: #2458a6;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #163d7a;
        }

        .error {
            color: red;
            font-size: 13px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 9px;
            text-align: left;
        }

        th {
            background: #2458a6;
            color: white;
        }

        .delete-btn {
            background: #c62828;
            margin: 0;
        }
    </style>
</head>

<body ng-controller="StudentController">

<div class="container">
    <h2>Student Registration Form</h2>

    <form name="studentForm"
          ng-submit="registerStudent()"
          novalidate>

        <label>Student Name:</label>
        <input type="text" ng-model="student.name"
               name="name" required>

        <span class="error"
              ng-show="studentForm.name.$touched &&
                       studentForm.name.$invalid">
            Name is required.
        </span>

        <label>Enrollment Number:</label>
        <input type="text" ng-model="student.enrollment"
               name="enrollment" required>

        <label>Email:</label>
        <input type="email" ng-model="student.email"
               name="email" required>

        <label>Mobile Number:</label>
        <input type="tel" ng-model="student.mobile"
               name="mobile" ng-pattern="/^[0-9]{10}$/"
               required>

        <span class="error"
              ng-show="studentForm.mobile.$touched &&
                       studentForm.mobile.$invalid">
            Enter a valid 10-digit mobile number.
        </span>

        <label>Gender:</label>
        <select ng-model="student.gender" required>
            <option value="">Select Gender</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
        </select>

        <label>Course:</label>
        <select ng-model="student.course" required>
            <option value="">Select Course</option>
            <option>B.Tech</option>
            <option>BCA</option>
            <option>B.Sc</option>
            <option>MCA</option>
        </select>

        <label>Semester:</label>
        <select ng-model="student.semester" required>
            <option value="">Select Semester</option>
            <option ng-repeat="s in semesters" value="{{s}}">
                {{s}}
            </option>
        </select>

        <label>Hobbies:</label>
        <input type="text" ng-model="student.hobbies"
               placeholder="Reading, Gaming, Sports">

        <label>Address:</label>
        <textarea ng-model="student.address"
                  rows="3" required></textarea>

        <button type="submit"
                ng-disabled="studentForm.$invalid">
            Register
        </button>

        <button type="button" ng-click="resetForm()">
            Reset
        </button>
    </form>

    <h3>Registered Students</h3>

    <p>
        Total Students: {{ students.length }}
    </p>

    <table ng-if="students.length > 0">
        <thead>
            <tr>
                <th>Enrollment</th>
                <th>Name</th>
                <th>Course</th>
                <th>Semester</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody>
            <tr ng-repeat="s in students track by $index">
                <td>{{ s.enrollment }}</td>
                <td>{{ s.name }}</td>
                <td>{{ s.course }}</td>
                <td>{{ s.semester }}</td>
                <td>
                    <button class="delete-btn"
                            ng-click="deleteStudent($index)">
                        Delete
                    </button>
                </td>
            </tr>
        </tbody>
    </table>

    <p ng-if="students.length === 0">
        No students registered yet.
    </p>
</div>

</body>
</html>
